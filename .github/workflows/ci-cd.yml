name: CI/CD app_conf

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validar sintaxis key=value de los .conf
        run: |
          shopt -s nullglob
          files=(*.conf)
          [ ${#files[@]} -gt 0 ] || { echo "no hay .conf en el repo"; exit 1; }
          for f in "${files[@]}"; do
            echo "checking $f"
            awk -v file="$f" 'NF && $0 !~ /^[A-Za-z_][A-Za-z0-9_]*=.*/ { print "linea invalida en " file ": " $0; exit 1 }' "$f" || exit 1
          done

